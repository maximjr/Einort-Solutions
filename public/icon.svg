<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer metallic background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shadow" dx="0" dy="2" stdDeviation="3">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Hexagon Path -->
  <path d="M50 5 L90 28 L90 72 L50 95 L10 72 L10 28 Z" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Inner geometry for 3D effect -->
  <path d="M50 15 L80 33 L80 67 L50 85 L20 67 L20 33 Z" fill="url(#innerGrad)"/>

  <!-- Keyhole Top (Circle) -->
  <circle cx="50" cy="42" r="8" fill="#000"/>
  <!-- Keyhole Bottom (Triangle) -->
  <path d="M47 48 L42 66 L58 66 L53 48 Z" fill="#000"/>
</svg>
